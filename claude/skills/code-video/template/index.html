<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traksy Pilot Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ground:#e8e5e0; --ink:#27323c; --muted:#505a64; --forest:#0b3d2e; }
  html, body { margin:0; height:100%; background:#1b1f23; color:#e8e5e0; font-family:"Plus Jakarta Sans", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; box-sizing:border-box; }
  #stage { width:min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; border-radius:10px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; width:min(100%, calc((100vh - 110px) * 16 / 9)); font-size:14px; }
  button, label.btn { background:#2b3238; color:#e8e5e0; border:1px solid #3a434b; border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover, label.btn:hover { background:#353d44; }
  input[type=range] { flex:1; min-width:120px; accent-color:#ff6b4a; }
  input[type=file] { display:none; }
  #time { font-variant-numeric:tabular-nums; min-width:92px; }
  #note { color:#9aa3ab; font-size:13px; width:min(100%, calc((100vh - 110px) * 16 / 9)); }
  body.capture { padding:0; background:#e8e5e0; }
  body.capture .bar, body.capture #note { display:none; }
  body.capture #stage { width:1920px; }
  body.capture canvas { border-radius:0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="bar">
  <button id="play">Play</button>
  <span id="time">0.0 / 0.0</span>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <button id="sound">Sound on</button>
  <button id="loop">Loop off</button>
  <label class="btn">Load voiceover<input id="vo" type="file" accept="audio/*"></label>
  <label class="btn">Load word timings<input id="words" type="file" accept=".json"></label>
</div>
<div id="note">No voiceover loaded: scenes use estimated timings. Load your recording and its Whisper word-timings JSON to sync.</div>

<script>
// ---------- Script and timeline ----------
// Each beat is one scene. `line` is the spoken script; `dur` is the estimate used until word timings are loaded.
const BEATS = [
  { id:'hook',       dur:7.5,  line:"Every week, our students win games, break records and step up for their houses. And most of it never gets noticed." },
  { id:'problem',    dur:7.0,  line:"Points sit in spreadsheets, results get lost in emails, and the newsletter takes hours to put together." },
  { id:'intro',      dur:3.5,  line:"Traksy puts all of it in one place." },
  { id:'points',     dur:6.5,  line:"Staff log house points and achievements in seconds, and the leaderboard updates straight away." },
  { id:'newsletter', dur:6.5,  line:"Every win becomes an announcement, then a newsletter and social posts, ready to send." },
  { id:'portal',     dur:4.5,  line:"Students and parents see their recognition in their own portal." },
  { id:'trust',      dur:8.0,  line:"Student data is stored in Australia, admins sign in with two-factor, and media consent is tracked for every student." },
  { id:'cta',        dur:10.5, line:"For our pilot, it costs the school nothing. I run it and I cover the costs. Let's make sure every student gets recognised." },
];
const TAIL = 1.5; // hold after the last word
let starts = [], total = 0;

function useEstimates() {
  let t = 0.4; starts = [];
  for (const b of BEATS) { starts.push(t); t += b.dur; }
  total = t + 0.6;
}

// Align beats to Whisper word timings: find each beat's opening words, in order.
// Tries word pairs 1-2, 2-3, 3-4 so one misheard word (Whisper hears "Traksy" as "Traxy") doesn't break it.
const norm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
function useWordTimings(words) {
  const ws = words.map(w => ({ w: norm(w.word), start: w.start, end: w.end })).filter(w => w.w);
  let p = 0; const found = [];
  for (const b of BEATS) {
    const key = b.line.split(/\s+/).map(norm).filter(Boolean).slice(0, 4);
    let hit = -1;
    for (let k = 0; k < key.length - 1 && hit < 0; k++)
      for (let i = p + k; i < ws.length - 1; i++) if (ws[i].w === key[k] && ws[i + 1].w === key[k + 1]) { hit = i - k; break; }
    if (hit < 0) return `Couldn't find the start of: "${b.line.slice(0, 40)}..."`;
    found.push(Math.max(0, ws[hit].start - 0.25)); p = hit + 1;
  }
  found[0] = Math.min(found[0], 0.4);
  starts = found; total = ws[ws.length - 1].end + TAIL;
  return null;
}
useEstimates();

function beatAt(t) {
  let i = 0; while (i + 1 < starts.length && t >= starts[i + 1]) i++;
  const end = i + 1 < starts.length ? starts[i + 1] : total;
  return { i, lt: t - starts[i], d: end - starts[i] };
}

// ---------- Drawing helpers ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1920, H = 1080;
const C = { ground:'#e8e5e0', card:'#f4f2ee', shade:'#c9c3b9', hi:'#faf8f5', ink:'#27323c', muted:'#505a64',
  green:'#176047', forest:'#0b3d2e', emerald:'#1f7a5a', coral:'#ff6b4a', coralDeep:'#b43e22', gold:'#e9b949',
  houseGold:'#e6a817', rose:'#ff5c7a', red:'#ee5866', purple:'#7c6cd6', amber:'#ff9e45' };
const FONT = '"Plus Jakarta Sans", system-ui, sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// Raised neumorphic card: light from top-left, shade bottom-right.
function card(x, y, w, h, r = 28, fill = C.card, depth = 1) {
  g.save();
  g.shadowColor = 'rgba(160,150,135,.55)'; g.shadowBlur = 40 * depth; g.shadowOffsetX = 14 * depth; g.shadowOffsetY = 16 * depth;
  rr(x, y, w, h, r); g.fillStyle = fill; g.fill();
  g.shadowColor = 'rgba(255,255,255,.9)'; g.shadowBlur = 30 * depth; g.shadowOffsetX = -10 * depth; g.shadowOffsetY = -10 * depth;
  g.fill();
  g.restore();
}

function text(s, x, y, size, { weight = 700, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, spacing = 0 } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color;
  g.textAlign = align; g.textBaseline = base; if (spacing) g.letterSpacing = spacing + 'px';
  g.fillText(s, x, y); g.restore();
}

function chip(x, y, r, tint, icon, iconColor) {
  g.save(); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = tint; g.fill(); g.restore();
  icon(x, y, r * 0.55, iconColor);
}

// Simple vector icons, centred on (x, y), sized by s.
const icons = {
  trophy(x, y, s, col) {
    g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = s * 0.16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - s * .6, y - s * .75); g.lineTo(x + s * .6, y - s * .75);
    g.quadraticCurveTo(x + s * .6, y + s * .15, x, y + s * .2); g.quadraticCurveTo(x - s * .6, y + s * .15, x - s * .6, y - s * .75); g.fill();
    g.beginPath(); g.arc(x - s * .6, y - s * .45, s * .28, Math.PI * .5, Math.PI * 1.5); g.stroke();
    g.beginPath(); g.arc(x + s * .6, y - s * .45, s * .28, -Math.PI * .5, Math.PI * .5); g.stroke();
    g.fillRect(x - s * .1, y + s * .15, s * .2, s * .4); rr(x - s * .42, y + s * .52, s * .84, s * .22, s * .06); g.fill();
    g.restore();
  },
  medal(x, y, s, col) {
    g.save(); g.fillStyle = C.coral; g.beginPath(); g.moveTo(x - s * .45, y - s); g.lineTo(x - s * .05, y - s * .1); g.lineTo(x - s * .35, y - s * .1); g.lineTo(x - s * .75, y - s); g.fill();
    g.fillStyle = C.red; g.beginPath(); g.moveTo(x + s * .45, y - s); g.lineTo(x + s * .05, y - s * .1); g.lineTo(x + s * .35, y - s * .1); g.lineTo(x + s * .75, y - s); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y + s * .3, s * .55, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(x, y + s * .3, s * .28, 0, Math.PI * 2); g.fill(); g.restore();
  },
  star(x, y, s, col) {
    g.save(); g.fillStyle = col; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * .42 : s; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    g.closePath(); g.fill(); g.restore();
  },
  check(x, y, s, col) {
    g.save(); g.strokeStyle = col; g.lineWidth = s * .22; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(x - s * .55, y); g.lineTo(x - s * .15, y + s * .4); g.lineTo(x + s * .6, y - s * .45); g.stroke(); g.restore();
  },
  pin(x, y, s, col) {
    g.save(); g.fillStyle = col; g.beginPath(); g.arc(x, y - s * .25, s * .55, Math.PI * .85, Math.PI * .15);
    g.lineTo(x, y + s * .85); g.closePath(); g.fill(); g.fillStyle = C.card; g.beginPath(); g.arc(x, y - s * .25, s * .22, 0, Math.PI * 2); g.fill(); g.restore();
  },
  lock(x, y, s, col) {
    g.save(); g.strokeStyle = col; g.lineWidth = s * .18; g.beginPath(); g.arc(x, y - s * .2, s * .38, Math.PI, 0); g.lineTo(x + s * .38, y + s * .05); g.moveTo(x - s * .38, y + s * .05); g.lineTo(x - s * .38, y - s * .2); g.stroke();
    g.fillStyle = col; rr(x - s * .62, y, s * 1.24, s * .9, s * .14); g.fill(); g.fillStyle = C.card; g.beginPath(); g.arc(x, y + s * .42, s * .13, 0, Math.PI * 2); g.fill(); g.restore();
  },
  mail(x, y, s, col) {
    g.save(); g.strokeStyle = col; g.lineWidth = s * .14; g.lineJoin = 'round'; rr(x - s * .8, y - s * .55, s * 1.6, s * 1.1, s * .12); g.stroke();
    g.beginPath(); g.moveTo(x - s * .75, y - s * .45); g.lineTo(x, y + s * .1); g.lineTo(x + s * .75, y - s * .45); g.stroke(); g.restore();
  },
  clock(x, y, s, col) {
    g.save(); g.strokeStyle = col; g.lineWidth = s * .14; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, s * .8, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - s * .5); g.moveTo(x, y); g.lineTo(x + s * .35, y + s * .15); g.stroke(); g.restore();
  },
};

// Scene envelope: slide up and fade in over the first 0.6 s, fade out over the last 0.35 s.
function envelope(lt, d) {
  const inP = easeOut(prog(lt, 0, 0.6)), outP = prog(lt, d - 0.35, d);
  return { alpha: inP * (1 - outP), dy: (1 - inP) * 40 - outP * 20 };
}

function background(t) {
  g.fillStyle = C.ground; g.fillRect(0, 0, W, H);
  // slow drifting warm glows
  const glow = (x, y, r, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(232,229,224,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  glow(380 + Math.sin(t * .23) * 120, 260 + Math.cos(t * .19) * 60, 700, 'rgba(255,158,69,.13)');
  glow(1560 + Math.cos(t * .17) * 140, 820 + Math.sin(t * .21) * 70, 760, 'rgba(31,122,90,.10)');
}

// Word-by-word line reveal used for headlines.
function revealLine(words, x, y, size, lt, t0, per, opts = {}) {
  g.save(); g.font = `${opts.weight || 800} ${size}px ${FONT}`;
  const space = g.measureText(' ').width; let widths = words.map(w => g.measureText(w).width);
  let full = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let cx = opts.align === 'center' ? x - full / 2 : x; g.restore();
  words.forEach((w, i) => {
    const p = easeOut(prog(lt, t0 + i * per, t0 + i * per + 0.45));
    text(w, cx, y + (1 - p) * 26, size, { weight: opts.weight || 800, color: (opts.colors && opts.colors[i]) || opts.color || C.ink, alpha: p });
    cx += widths[i] + space;
  });
}

function caption(s, lt, y = 150, size = 52) {
  const p = easeOut(prog(lt, 0.1, 0.7));
  text(s, W / 2, y + (1 - p) * 20, size, { weight: 800, align: 'center', alpha: p });
}

// ---------- Scenes (lt = seconds into scene, d = scene length) ----------
const SCENES = {
  hook(lt, d, t) {
    const floaters = [
      [300, 300, icons.trophy, C.houseGold, 'rgba(233,185,73,.22)'], [1620, 260, icons.medal, C.gold, 'rgba(255,107,74,.16)'],
      [240, 780, icons.star, C.coral, 'rgba(255,107,74,.16)'], [1680, 790, icons.trophy, C.emerald, 'rgba(31,122,90,.14)'],
    ];
    floaters.forEach(([x, y, ic, col, tint], i) => {
      const p = back(prog(lt, 0.2 + i * 0.25, 0.9 + i * 0.25));
      g.save(); g.globalAlpha *= clamp(p); const fy = y + Math.sin(t * 1.3 + i) * 12;
      g.translate(x, fy); g.scale(p, p); card(-80, -80, 160, 160, 80); chip(0, 0, 58, tint, ic, col); g.restore();
    });
    revealLine(['Every', 'week,', 'our', 'students'], W / 2, 400, 92, lt, 0.2, 0.16, { align: 'center' });
    revealLine(['win', 'games.'], W / 2, 510, 92, lt, 1.0, 0.18, { align: 'center', colors: [C.coralDeep, C.coralDeep] });
    revealLine(['Break', 'records.'], W / 2, 620, 92, lt, 1.8, 0.18, { align: 'center', colors: [C.green, C.green] });
    revealLine(['Step', 'up', 'for', 'their', 'house.'], W / 2, 730, 92, lt, 2.6, 0.14, { align: 'center' });
    const q = easeOut(prog(lt, d * 0.68, d * 0.68 + 0.6));
    text('Most of it never gets noticed.', W / 2, 870 + (1 - q) * 20, 50, { weight: 600, color: C.muted, align: 'center', alpha: q });
  },

  problem(lt, d) {
    caption('Spreadsheets. Emails. Hours of newsletters.', lt);
    const cards = [
      { x: 260, rot: -0.06, title: 'house_points_FINAL_v3.xlsx', draw: (x, y) => {
          g.strokeStyle = '#d6d0c6'; g.lineWidth = 2;
          for (let r = 0; r < 7; r++) { g.beginPath(); g.moveTo(x + 30, y + 110 + r * 52); g.lineTo(x + 430, y + 110 + r * 52); g.stroke(); }
          for (let c = 0; c < 4; c++) { g.beginPath(); g.moveTo(x + 30 + c * 133, y + 110); g.lineTo(x + 30 + c * 133, y + 422); g.stroke(); }
          const vals = ['Banksia', '412', '#REF!', 'Waratah', '??', '388', 'Wollemi', '401', ''];
          vals.forEach((v, i) => text(v, x + 44 + (i % 3) * 133, y + 148 + Math.floor(i / 3) * 52, 24, { weight: 600, color: v === '#REF!' || v === '??' ? C.red : C.muted }));
        } },
      { x: 735, rot: 0.04, title: 'Re: Re: Fwd: results??', draw: (x, y) => {
          chip(x + 230, y + 220, 90, 'rgba(80,90,100,.10)', icons.mail, C.muted);
          text('14 unread', x + 230, y + 375, 30, { weight: 700, color: C.red, align: 'center' });
        } },
      { x: 1210, rot: -0.03, title: 'Newsletter draft', draw: (x, y) => {
          chip(x + 230, y + 220, 90, 'rgba(80,90,100,.10)', icons.clock, C.muted);
          text('3 hrs, every week', x + 230, y + 375, 30, { weight: 700, color: C.red, align: 'center' });
        } },
    ];
    const grey = easeInOut(prog(lt, d * 0.62, d * 0.62 + 0.5));
    cards.forEach((c, i) => {
      const p = back(prog(lt, 0.3 + i * 0.45, 0.95 + i * 0.45)); if (p <= 0) return;
      const y = 300 + (1 - p) * 120;
      g.save(); g.globalAlpha *= clamp(p) * (1 - grey * 0.45); g.translate(c.x + 230, y + 230); g.rotate(c.rot * (1 + grey)); g.translate(-(c.x + 230), -(y + 230));
      card(c.x, y, 460, 460, 30);
      text(c.title, c.x + 32, y + 66, 26, { weight: 700, color: C.ink });
      c.draw(c.x, y); g.restore();
    });
    if (grey > 0) {
      g.save(); g.strokeStyle = C.coral; g.lineWidth = 10; g.lineCap = 'round';
      g.beginPath(); g.moveTo(240, 900); g.lineTo(lerp(240, 1690, grey), 900); g.stroke(); g.restore();
    }
  },

  intro(lt, d) {
    const p = back(prog(lt, 0.1, 0.8));
    g.save(); g.translate(W / 2, 420); g.scale(p, p); card(-120, -120, 240, 240, 120); chip(0, 0, 84, 'rgba(233,185,73,.25)', icons.trophy, C.houseGold); g.restore();
    const w = easeOut(prog(lt, 0.5, 1.1));
    text('Traksy', W / 2, 700 + (1 - w) * 30, 150, { weight: 800, color: C.forest, align: 'center', alpha: w, spacing: -3 });
    const s = easeOut(prog(lt, 1.1, 1.7));
    text('Every point, award and win. One place.', W / 2, 800 + (1 - s) * 20, 48, { weight: 600, color: C.muted, align: 'center', alpha: s });
  },

  points(lt, d) {
    caption('Log it in seconds. The leaderboard updates live.', lt);
    // Log points card
    const a = easeOut(prog(lt, 0.2, 0.8));
    g.save(); g.globalAlpha *= a; g.translate(0, (1 - a) * 40);
    card(170, 280, 640, 600, 32);
    text('Log points', 220, 360, 40, { weight: 800 });
    const field = (label, val, y) => { text(label, 220, y, 24, { weight: 600, color: C.muted }); rr(220, y + 16, 540, 74, 18); g.fillStyle = C.ground; g.fill(); text(val, 248, y + 64, 32, { weight: 700 }); };
    field('Student', 'Mia S.', 420); field('House', 'Banksia', 540);
    field('Reason', 'Cross country, 1st place', 660);
    const press = prog(lt, 2.2, 2.45), rel = prog(lt, 2.45, 2.7), sc = 1 - 0.05 * press + 0.05 * rel;
    g.save(); g.translate(490, 830); g.scale(sc, sc); g.translate(-490, -830);
    rr(220, 790, 540, 80, 22); g.fillStyle = C.forest; g.fill(); text('+5 points', 490, 843, 34, { weight: 800, color: '#fff', align: 'center' }); g.restore();
    g.restore();
    // Leaderboard card
    const b = easeOut(prog(lt, 0.5, 1.1));
    g.save(); g.globalAlpha *= b; g.translate(0, (1 - b) * 40);
    card(900, 280, 850, 600, 32);
    text('House leaderboard', 950, 360, 40, { weight: 800 });
    const bump = easeOut(prog(lt, 2.6, 3.4));
    const houses = [
      ['Banksia', C.houseGold, 1725 + 5 * bump], ['Waratah', C.red, 1728], ['Wollemi', C.emerald, 1650], ['Jacaranda', C.purple, 1588],
    ];
    const order = houses.slice().sort((p, q) => q[2] - p[2]);
    houses.forEach(h => {
      const rank = order.indexOf(h), prevRank = [1, 0, 2, 3][houses.indexOf(h)];
      const y = 430 + lerp(prevRank, rank, bump) * 110;
      const grow = easeOut(prog(lt, 0.9, 1.9));
      g.save(); g.beginPath(); g.arc(970, y + 18, 13, 0, Math.PI * 2); g.fillStyle = h[1]; g.fill(); g.restore();
      text(h[0], 998, y + 29, 30, { weight: 700 });
      rr(1200, y + 4, 380, 28, 14); g.fillStyle = '#e3dfd8'; g.fill();
      rr(1200, y + 4, 380 * grow * (h[2] - 1400) / 360, 28, 14); g.fillStyle = h[1]; g.fill();
      text(Math.round(h[2] * grow + 0 * (1 - grow)).toLocaleString(), 1700, y + 30, 28, { weight: 800, align: 'right' });
    });
    g.restore();
    // toast
    const tp = back(prog(lt, 2.6, 3.1)), tout = prog(lt, d - 1.2, d - 0.8);
    if (tp > 0) { g.save(); g.globalAlpha *= clamp(tp) * (1 - tout); g.translate(1325, 230); g.scale(tp, tp);
      card(-170, -42, 340, 84, 42, '#fff'); chip(-122, 0, 26, 'rgba(233,185,73,.3)', icons.star, C.houseGold);
      text('+5 Banksia', 20, 12, 32, { weight: 800, color: C.green, align: 'center' }); g.restore(); }
  },

  newsletter(lt, d) {
    caption('Every win becomes a newsletter and social posts.', lt);
    // announcement card moves into newsletter
    const a = easeOut(prog(lt, 0.2, 0.8)), mv = easeInOut(prog(lt, 1.4, 2.3));
    const ax = lerp(200, 640, mv), ay = lerp(400, 470, mv), asc = lerp(1, 0.62, mv);
    // newsletter document
    const n = easeOut(prog(lt, 1.1, 1.8));
    g.save(); g.globalAlpha *= n; g.translate(0, (1 - n) * 40);
    card(560, 260, 620, 680, 30, '#fff');
    rr(560, 260, 620, 120, [30, 30, 0, 0]); g.fillStyle = C.forest; g.fill();
    text('Week 6 Sport News', 600, 335, 38, { weight: 800, color: '#fff' });
    g.fillStyle = '#ebe7e1'; [700, 740, 780].forEach((y, i) => { rr(600, y + 120, i === 2 ? 340 : 540, 18, 9); g.fill(); });
    rr(600, 600 + 120 + 100, 540, 0, 0);
    g.restore();
    g.save(); g.globalAlpha *= a; g.translate(ax, ay); g.scale(asc, asc);
    card(0, 0, 860, 230, 28, C.card, 1 - mv * 0.6);
    chip(110, 115, 62, 'rgba(255,107,74,.18)', icons.medal, C.gold);
    text('New record', 210, 95, 28, { weight: 700, color: C.coralDeep });
    text('Mia S. broke the 50m freestyle', 210, 145, 38, { weight: 800 });
    text('record at the swimming carnival', 210, 192, 38, { weight: 800 });
    g.restore();
    // social tiles
    const tiles = [['Post', C.coral], ['Story', C.emerald], ['Post', C.houseGold]];
    tiles.forEach(([lab, col], i) => {
      const p = back(prog(lt, 2.6 + i * 0.3, 3.2 + i * 0.3)); if (p <= 0) return;
      const x = 1260 + i * 30, y = 300 + i * 200;
      g.save(); g.translate(x + 180, y + 85); g.rotate((i - 1) * 0.04); g.scale(p, p); g.translate(-180, -85);
      card(0, 0, 400, 170, 24, '#fff');
      rr(20, 20, 130, 130, 16); g.fillStyle = col; g.globalAlpha *= .85; g.fill(); g.globalAlpha /= .85;
      icons.medal(85, 85, 34, '#fff');
      text(lab, 175, 70, 28, { weight: 800 }); g.fillStyle = '#ebe7e1'; rr(175, 95, 190, 14, 7); g.fill(); rr(175, 122, 130, 14, 7); g.fill();
      g.restore();
    });
  },

  portal(lt, d) {
    caption('Students and parents see it in their own portal.', lt);
    const p = easeOut(prog(lt, 0.2, 0.9));
    g.save(); g.globalAlpha *= p; g.translate(W / 2, 600 + (1 - p) * 60);
    card(-230, -380, 460, 820, 60, '#fff');
    rr(-200, -350, 400, 760, 40); g.fillStyle = C.ground; g.fill();
    text('Hi, Mia', -170, -270, 44, { weight: 800 });
    text('Banksia house', -170, -225, 24, { weight: 600, color: C.muted });
    const items = [['Achievements', '3', icons.medal, C.gold, 'rgba(255,107,74,.16)'], ['House points', '1,730', icons.trophy, C.houseGold, 'rgba(233,185,73,.22)'], ['New record', '50m free', icons.star, C.coral, 'rgba(255,107,74,.16)']];
    items.forEach(([lab, val, ic, col, tint], i) => {
      const q = back(prog(lt, 0.8 + i * 0.35, 1.4 + i * 0.35)); if (q <= 0) return;
      g.save(); g.globalAlpha *= clamp(q); const y = -170 + i * 175; g.translate(0, (1 - q) * 30);
      card(-175, y, 350, 145, 26, C.card, .7); chip(-110, y + 72, 40, tint, ic, col);
      text(lab, -55, y + 60, 24, { weight: 600, color: C.muted }); text(val, -55, y + 105, 38, { weight: 800 }); g.restore();
    });

  },

  trust(lt, d) {
    caption('Built for student data.', lt);
    const tiles = [
      [icons.pin, C.emerald, 'rgba(31,122,90,.15)', 'Stored in', 'Australia'],
      [icons.lock, C.forest, 'rgba(11,61,46,.12)', 'Two-factor', 'for admins'],
      [icons.check, C.coralDeep, 'rgba(255,107,74,.16)', 'Media consent', 'per student'],
    ];
    const step = d / 3.4;
    tiles.forEach(([ic, col, tint, l1, l2], i) => {
      const p = back(prog(lt, 0.4 + i * step, 1.0 + i * step)); if (p <= 0) return;
      const x = 290 + i * 470;
      g.save(); g.globalAlpha *= clamp(p); g.translate(x + 200, 560); g.scale(p, p); g.translate(-200, 0);
      card(0, -230, 400, 460, 34); chip(200, -70, 92, tint, ic, col);
      text(l1, 200, 110, 40, { weight: 800, align: 'center' }); text(l2, 200, 162, 40, { weight: 800, align: 'center', color: col });
      g.restore();

  },

  cta(lt, d) {
    const a = easeOut(prog(lt, 0.1, 0.7));
    text('Free for our pilot.', W / 2, 400 + (1 - a) * 30, 120, { weight: 800, align: 'center', alpha: a, color: C.forest, spacing: -2 });
    const b = easeOut(prog(lt, d * 0.3, d * 0.3 + 0.6));
    text('I run it. I cover the costs. No cost to the school.', W / 2, 500 + (1 - b) * 20, 46, { weight: 600, align: 'center', color: C.muted, alpha: b });
    const c = back(prog(lt, d * 0.62, d * 0.62 + 0.7));
    if (c > 0) {
      g.save(); g.globalAlpha *= clamp(c); g.translate(W / 2, 760); g.scale(c, c);
      card(-560, -120, 1120, 240, 120);
      chip(-430, 0, 78, 'rgba(233,185,73,.25)', icons.trophy, C.houseGold);
      text('Every student, recognised.', 70, 22, 64, { weight: 800, align: 'center' });
      text('Traksy', 70, 82, 34, { weight: 800, align: 'center', color: C.forest });
      g.restore();
    }
  },
};

function render(t) {
  t = clamp(t, 0, total);
  background(t);
  const { i, lt, d } = beatAt(t);
  const env = envelope(lt, d);
  if (t > total - 0.6) env.alpha *= 1 - prog(t, total - 0.6, total);
  g.save(); g.globalAlpha = env.alpha; g.translate(0, env.dy);
  SCENES[BEATS[i].id](lt, d, t);
  g.restore();
}

// ---------- Sound effects (synthesised, no files) ----------
// Events are listed relative to scene starts so they move with the voiceover timing.
function sfxEvents() {
  const ev = [], at = (i, dt, type, v = 1) => ev.push({ t: starts[i] + dt, type, v });
  starts.forEach((s, i) => at(i, 0, 'whoosh', 0.6));
  [0.2, 0.45, 0.7, 0.95].forEach(x => at(0, x + 0.3, 'pop', 0.5));
  [0.3, 0.75, 1.2].forEach(x => at(1, x + 0.3, 'thud', 0.7));
  at(1, BEATS[1].dur * 0.62, 'scratch', 0.5);
  at(2, 0.3, 'chime', 0.9);
  at(3, 2.25, 'click', 0.8); at(3, 2.65, 'ding', 0.9);
  at(4, 1.4, 'whoosh', 0.5); [2.6, 2.9, 3.2].forEach(x => at(4, x, 'pop', 0.6));
  [0.8, 1.15, 1.5].forEach(x => at(5, x, 'pop', 0.5));
  [0, 1, 2].forEach(k => at(6, 0.4 + k * (beatLen(6) / 3.4), 'pop', 0.7));
  at(7, beatLen(7) * 0.62, 'chime', 1);
  return ev.sort((a, b) => a.t - b.t);
}
function beatLen(i) { return (i + 1 < starts.length ? starts[i + 1] : total) - starts[i]; }

function playSfx(ctx, out, type, when, v) {
  const o = (f, dur, wave = 'sine', vol = .3, f2) => {
    const osc = ctx.createOscillator(), gn = ctx.createGain(); osc.type = wave; osc.frequency.setValueAtTime(f, when);
    if (f2) osc.frequency.exponentialRampToValueAtTime(f2, when + dur);
    gn.gain.setValueAtTime(0.0001, when); gn.gain.exponentialRampToValueAtTime(vol * v, when + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(gn).connect(out); osc.start(when); osc.stop(when + dur + 0.05);
  };
  const noise = (dur, f1, f2, vol) => {
    const len = Math.ceil(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let seed = 7; for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), gn = ctx.createGain(); src.buffer = buf;
    bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(f1, when); bp.frequency.exponentialRampToValueAtTime(f2, when + dur);
    gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(vol * v, when + dur * .45); gn.gain.linearRampToValueAtTime(0.0001, when + dur);
    src.connect(bp).connect(gn).connect(out); src.start(when);
  };
  if (type === 'whoosh') noise(0.45, 300, 2400, .18);
  if (type === 'scratch') noise(0.5, 1800, 600, .14);
  if (type === 'pop') o(520, .12, 'sine', .22, 900);
  if (type === 'thud') o(140, .22, 'sine', .35, 60);
  if (type === 'click') o(1800, .04, 'square', .06);
  if (type === 'ding') { o(1318.5, .6, 'sine', .16); o(1975.5, .5, 'sine', .08); }
  if (type === 'chime') { // rising arpeggio, C major
    const base = when;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { when = base + i * .07; o(f, .9, 'triangle', .1); });
  }
}

// Offline render of the whole SFX track, returned as base64 mono WAV (used by render.mjs).
async function sfxWavBase64() {
  const sr = 44100, ctx = new OfflineAudioContext(1, Math.ceil(sr * total), sr);
  const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
  for (const e of sfxEvents()) playSfx(ctx, master, e.type, e.t, e.v);
  const buf = await ctx.startRendering(), d = buf.getChannelData(0);
  const bytes = new Uint8Array(44 + d.length * 2), dv = new DataView(bytes.buffer);
  const w = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); dv.setUint32(4, 36 + d.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) dv.setInt16(44 + i * 2, clamp(d[i], -1, 1) * 32767, true);
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ---------- Player ----------
const $ = id => document.getElementById(id);
let playing = false, soundOn = true, loop = false, clock0 = 0, pos = 0, lastT = 0, actx = null, voice = null;

function now() { return voice && playing ? voice.currentTime : playing ? (performance.now() - clock0) / 1000 : pos; }
function setPlaying(on) {
  playing = on; $('play').textContent = on ? 'Pause' : 'Play';
  if (on) { if (!actx) actx = new AudioContext(); actx.resume(); clock0 = performance.now() - pos * 1000; lastT = pos;
    if (voice) { voice.currentTime = pos; voice.muted = !soundOn; voice.play(); } }
  else { pos = now(); if (voice) voice.pause(); }
}
function tick() {
  let t = now();
  if (playing && t >= total) { if (loop) { pos = 0; setPlaying(false); setPlaying(true); t = 0; } else { pos = total; setPlaying(false); t = total; } }
  if (playing && soundOn && actx) for (const e of sfxEvents()) if (e.t > lastT && e.t <= t) playSfx(actx, actx.destination, e.type, actx.currentTime, e.v);
  lastT = t; render(t);
  $('time').textContent = `${t.toFixed(1)} / ${total.toFixed(1)}`; $('scrub').value = Math.round(t / total * 1000);
  requestAnimationFrame(tick);
}
$('play').onclick = () => setPlaying(!playing);
$('scrub').oninput = e => { pos = e.target.value / 1000 * total; if (playing) { setPlaying(false); setPlaying(true); } };
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? 'Sound on' : 'Sound off'; if (voice) voice.muted = !soundOn; };
$('loop').onclick = () => { loop = !loop; $('loop').textContent = loop ? 'Loop on' : 'Loop off'; };
$('vo').onchange = e => { const f = e.target.files[0]; if (!f) return; voice = new Audio(URL.createObjectURL(f)); $('note').textContent = `Voiceover: ${f.name}. Load the word timings to sync scenes to it.`; };
$('words').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const j = JSON.parse(await f.text()), words = (j.segments || []).flatMap(s => s.words || []);
  const err = words.length ? useWordTimings(words) : 'No word timings in that file (run Whisper with --word_timestamps True).';
  $('note').textContent = err || `Synced ${BEATS.length} scenes to ${words.length} words. Length ${total.toFixed(1)} s.`;
  if (err) useEstimates();
};

// Hooks for render.mjs
window.__ready = document.fonts.load(`800 80px ${FONT}`).then(() => document.fonts.load(`600 40px ${FONT}`)).then(() => document.fonts.ready);
window.__total = () => total;
window.__render = t => { render(t); };
window.__frameJpeg = t => { render(t); return cv.toDataURL('image/jpeg', 0.93).split(',')[1]; };
window.__sfx = sfxWavBase64;
window.__useWords = words => useWordTimings(words);

if (new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');
else window.__ready.then(() => requestAnimationFrame(tick));
</script>
